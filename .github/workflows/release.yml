name: Release 3X-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Linux (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      # Frontend dist must be built BEFORE go build — Go's //go:embed
      # all:dist directive in internal/web/web.go requires internal/web/dist/ to exist
      # at compile time. internal/web/dist/ is .gitignored, so on a fresh CI
      # checkout it doesn't exist until vite emits it.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build 3X-UI
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          fetch() { wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 "$@"; }
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}

          # Use Bootlin prebuilt cross-toolchains
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
          esac

          BOOTLIN_BASE="/tmp/bootlin"
          mkdir -p "$BOOTLIN_BASE"
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})..."
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading $TARBALL_URL..."
          curl -fL -sS $CURL_RETRY -o "/tmp/$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "/tmp/$(basename "$TARBALL_URL")" -C "$BOOTLIN_BASE"
          rm -f "/tmp/$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find "$BOOTLIN_BASE" -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }

          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release -v .
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          cd x-ui/bin

          # Download dependencies
          XRAY_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/XTLS/Xray-core/releases/latest" | sed -n 's#.*/releases/tag/##p')
          XRAY_VER=${XRAY_VER:-v26.10.21}
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            fetch "${Xray_URL}Xray-linux-64.zip"
            unzip -q Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            fetch "${Xray_URL}Xray-linux-arm64-v8a.zip"
            unzip -q Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          fi

          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

          mv xray xray-linux-${{ matrix.platform }}

          case "${{ matrix.platform }}" in
            amd64|arm64)
              MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
              if [ -z "$MTG_MULTI_VER" ]; then echo "could not resolve the latest mtg-multi release tag"; exit 1; fi
              MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-${{ matrix.platform }}"
              curl -sfL $CURL_RETRY -o "${MTG_PKG}.tar.gz" "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
              tar -xzf "${MTG_PKG}.tar.gz"
              mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
              rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"
              ;;
          esac
          cd ../..

      - name: Package
        run: |
          tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
          sha256sum x-ui-linux-${{ matrix.platform }}.tar.gz > x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: |
            ./x-ui-linux-${{ matrix.platform }}.tar.gz
            ./x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz*
          file_glob: true
          overwrite: true
          prerelease: false

  # =================================
  #  Windows Build (cross-compiled on Linux runner)
  # =================================
  build-windows:
    name: Build Windows (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Install LLVM-MinGW Toolchain
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          RUNNER_ARCH=$(uname -m)
          case "$RUNNER_ARCH" in
            x86_64) LLVM_ARCH="x86_64" ;;
            aarch64|arm64) LLVM_ARCH="aarch64" ;;
            *) echo "Unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
          esac

          LLVM_BASE="/tmp/llvm-mingw"
          mkdir -p "$LLVM_BASE"
          echo "Downloading LLVM-MinGW for ${LLVM_ARCH} to $LLVM_BASE..."
          curl -fsSL $CURL_RETRY "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-${LLVM_ARCH}.tar.xz" | tar -xJ -C "$LLVM_BASE" --strip-components=1
          echo "$LLVM_BASE/bin" >> $GITHUB_PATH

      - name: Build 3X-UI for Windows (CGO)
        run: |
          # 1. Generate Windows resource (.syso) using native host environment
          PANEL_VERSION=$(tr -d '[:space:]' < internal/config/version)
          GOOS="" GOARCH="" go run github.com/tc-hib/go-winres@v0.3.3 make --arch ${{ matrix.platform }} \
            --product-version "$PANEL_VERSION" --file-version "$PANEL_VERSION"

          # 2. Cross-compile 3X-UI for Windows
          LLVM_BASE="/tmp/llvm-mingw"
          export PATH="$LLVM_BASE/bin:$PATH"
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=${{ matrix.platform }}

          if [ "${{ matrix.platform }}" = "arm64" ]; then
            export CC=aarch64-w64-mingw32-gcc
          else
            export CC=x86_64-w64-mingw32-gcc
          fi

          go version
          $CC --version

          LDFLAGS="-w -s"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release.exe -v .

      - name: Copy and download resources
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"

          mkdir -p x-ui/bin
          cp xui-release.exe x-ui/3x-ui.exe

          cd x-ui/bin

          XRAY_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/XTLS/Xray-core/releases/latest" | sed -n 's#.*/releases/tag/##p')
          XRAY_VER=${XRAY_VER:-v26.10.21}
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/"

          if [ "${{ matrix.platform }}" = "arm64" ]; then
            curl -fsSL $CURL_RETRY -o Xray-windows.zip "${Xray_URL}Xray-windows-arm64-v8a.zip"
          else
            curl -fsSL $CURL_RETRY -o Xray-windows.zip "${Xray_URL}Xray-windows-64.zip"
          fi
          unzip -q -o Xray-windows.zip
          rm -f Xray-windows.zip geoip.dat geosite.dat

          curl -fsSL $CURL_RETRY -o geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL $CURL_RETRY -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

          mv xray.exe "xray-windows-${{ matrix.platform }}.exe"

          MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
          MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-windows-${{ matrix.platform }}"
          curl -fsSL $CURL_RETRY -o "${MTG_PKG}.zip" "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.zip"
          unzip -q -o "${MTG_PKG}.zip" -d mtg-tmp
          mv "mtg-tmp/${MTG_PKG}/mtg-multi.exe" "mtg-windows-${{ matrix.platform }}.exe"
          rm -rf mtg-tmp "${MTG_PKG}.zip"

          cd ../..

          cp -r windows_files/* x-ui/

      - name: Package to Zip
        run: |
          zip -r "x-ui-windows-${{ matrix.platform }}.zip" x-ui
          sha256sum "x-ui-windows-${{ matrix.platform }}.zip" > "x-ui-windows-${{ matrix.platform }}.zip.sha256"

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-windows-${{ matrix.platform }}
          path: |
            ./x-ui-windows-${{ matrix.platform }}.zip
            ./x-ui-windows-${{ matrix.platform }}.zip.sha256

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-windows-${{ matrix.platform }}.zip*
          file_glob: true
          overwrite: true
          prerelease: false
