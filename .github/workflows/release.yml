name: Release 3X-UI

on:
  workflow_dispatch:
  # Only main (dev channel) and version tags ship binaries; build any other
  # branch on demand via workflow_dispatch.
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"

jobs:
  build:
    name: Build Linux (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Frontend dist must be built BEFORE go build — Go's //go:embed
      # all:dist directive in internal/web/web.go requires internal/web/dist/ to exist
      # at compile time. internal/web/dist/ is .gitignored, so on a fresh CI
      # checkout it doesn't exist until vite emits it.
      - name: Setup Node.js
        run: |
          if ! command -v node >/dev/null 2>&1; then
            for nvm_dir in "$HOME/.nvm" "/root/.nvm"; do
              if [ -s "$nvm_dir/nvm.sh" ]; then
                export NVM_DIR="$nvm_dir"
                . "$nvm_dir/nvm.sh"
                break
              fi
            done
            if command -v node >/dev/null 2>&1; then
              NODE_BIN_DIR=$(dirname "$(which node)")
              echo "$NODE_BIN_DIR" >> $GITHUB_PATH
              export PATH="$NODE_BIN_DIR:$PATH"
            fi
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "ERROR: node not found in PATH or NVM" >&2
            exit 1
          fi
          echo "Using node: $(which node) ($(node -v))"
          echo "Using npm: $(which npm) ($(npm -v))"

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build 3X-UI
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          fetch() { wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 "$@"; }
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
          esac
          echo "Resolving Bootlin musl toolchain for arch=$BOOTLIN_ARCH (platform=${{ matrix.platform }})"
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/"
          TARBALL_URL=$(curl -fsSL $CURL_RETRY "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\\.tar\\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "Failed to locate Bootlin musl toolchain for arch=$BOOTLIN_ARCH" >&2; exit 1; }
          echo "Downloading: $TARBALL_URL"
          cd /tmp
          curl -fL -sS $CURL_RETRY -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          [ -z "$CC" ] && { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          cd -
          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release -v .
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          cd x-ui/bin

          # Download dependencies
          XRAY_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/XTLS/Xray-core/releases/latest" | sed -n 's#.*/releases/tag/##p')
          XRAY_VER=${XRAY_VER:-v26.10.21}
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/"
          if [ "${{ matrix.platform }}" == "amd64" ]; then
            fetch ${Xray_URL}Xray-linux-64.zip
            unzip Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          elif [ "${{ matrix.platform }}" == "arm64" ]; then
            fetch ${Xray_URL}Xray-linux-arm64-v8a.zip
            unzip Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          fi
          rm -f geoip.dat geosite.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}
          case "${{ matrix.platform }}" in
            amd64|arm64)
              MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
              if [ -z "$MTG_MULTI_VER" ]; then echo "could not resolve the latest mtg-multi release tag"; exit 1; fi
              MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-${{ matrix.platform }}"
              curl -sfLRO $CURL_RETRY "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
              tar -xzf "${MTG_PKG}.tar.gz"
              mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
              rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"
              ;;
          esac
          cd ../..

      - name: Package
        run: |
          tar -zcvf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
          sha256sum x-ui-linux-${{ matrix.platform }}.tar.gz > x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: |
            ./x-ui-linux-${{ matrix.platform }}.tar.gz
            ./x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz*
          file_glob: true
          overwrite: true
          prerelease: true

  # =================================
  #  Windows Build (cross-compiled on Linux self-hosted runner)
  # =================================
  build-windows:
    name: Build Windows (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Setup Node.js
        run: |
          if ! command -v node >/dev/null 2>&1; then
            for nvm_dir in "$HOME/.nvm" "/root/.nvm"; do
              if [ -s "$nvm_dir/nvm.sh" ]; then
                export NVM_DIR="$nvm_dir"
                . "$nvm_dir/nvm.sh"
                break
              fi
            done
            if command -v node >/dev/null 2>&1; then
              NODE_BIN_DIR=$(dirname "$(which node)")
              echo "$NODE_BIN_DIR" >> $GITHUB_PATH
              export PATH="$NODE_BIN_DIR:$PATH"
            fi
          fi
          if ! command -v node >/dev/null 2>&1; then
            echo "ERROR: node not found in PATH or NVM" >&2
            exit 1
          fi
          echo "Using node: $(which node) ($(node -v))"
          echo "Using npm: $(which npm) ($(npm -v))"

      - name: Build frontend bundle
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Install LLVM-MinGW Toolchain
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          RUNNER_ARCH=$(uname -m)
          case "$RUNNER_ARCH" in
            x86_64) LLVM_ARCH="x86_64" ;;
            aarch64|arm64) LLVM_ARCH="aarch64" ;;
            *) echo "Unsupported runner arch: $RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p /tmp/llvm-mingw
          if [ ! -f /tmp/llvm-mingw/bin/aarch64-w64-mingw32-gcc ]; then
            echo "Downloading LLVM-MinGW for ${LLVM_ARCH}..."
            curl -fsSL $CURL_RETRY "https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-${LLVM_ARCH}.tar.xz" | tar -xJ -C /tmp/llvm-mingw --strip-components=1
          fi
          echo "/tmp/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Build 3X-UI for Windows (CGO)
        run: |
          # 1. Generate Windows resource (.syso) using native host environment
          PANEL_VERSION=$(tr -d '[:space:]' < internal/config/version)
          GOOS="" GOARCH="" go run github.com/tc-hib/go-winres@v0.3.3 make --arch ${{ matrix.platform }} \
            --product-version "$PANEL_VERSION" --file-version "$PANEL_VERSION"

          # 2. Cross-compile 3X-UI for Windows
          export PATH="/tmp/llvm-mingw/bin:$PATH"
          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=${{ matrix.platform }}

          if [ "${{ matrix.platform }}" = "arm64" ]; then
            export CC=aarch64-w64-mingw32-gcc
          else
            export CC=x86_64-w64-mingw32-gcc
          fi

          go version
          $CC --version

          LDFLAGS="-w -s"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release.exe -v .

      - name: Copy and download resources
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          unzip_file() {
            if command -v unzip >/dev/null 2>&1; then
              unzip -q -o "$1" ${2:+-d "$2"}
            else
              python3 -c "import zipfile, sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2] if len(sys.argv) > 2 else '.')" "$@"
            fi
          }

          mkdir -p x-ui/bin
          cp xui-release.exe x-ui/3x-ui.exe

          cd x-ui/bin
          XRAY_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/XTLS/Xray-core/releases/latest" | sed -n 's#.*/releases/tag/##p')
          XRAY_VER=${XRAY_VER:-v26.10.21}
          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/"

          if [ "${{ matrix.platform }}" = "arm64" ]; then
            curl -fsSL $CURL_RETRY -o Xray-windows.zip "${Xray_URL}Xray-windows-arm64-v8a.zip"
          else
            curl -fsSL $CURL_RETRY -o Xray-windows.zip "${Xray_URL}Xray-windows-64.zip"
          fi
          unzip_file Xray-windows.zip
          rm -f Xray-windows.zip geoip.dat geosite.dat

          curl -fsSL $CURL_RETRY -o geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL $CURL_RETRY -o geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          curl -fsSL $CURL_RETRY -o geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          curl -fsSL $CURL_RETRY -o geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          curl -fsSL $CURL_RETRY -o geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -fsSL $CURL_RETRY -o geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat

          mv xray.exe "xray-windows-${{ matrix.platform }}.exe"

          MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
          MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-windows-${{ matrix.platform }}"
          curl -fsSL $CURL_RETRY -o "${MTG_PKG}.zip" "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.zip"
          unzip_file "${MTG_PKG}.zip" mtg-tmp
          mv "mtg-tmp/${MTG_PKG}/mtg-multi.exe" "mtg-windows-${{ matrix.platform }}.exe"
          rm -rf mtg-tmp "${MTG_PKG}.zip"

          cd ../..

          cp -r windows_files/* x-ui/

      - name: Package to Zip
        run: |
          if command -v zip >/dev/null 2>&1; then
            zip -r "x-ui-windows-${{ matrix.platform }}.zip" x-ui
          else
            python3 -c "import shutil; shutil.make_archive('x-ui-windows-${{ matrix.platform }}', 'zip', '.', 'x-ui')"
          fi
          sha256sum "x-ui-windows-${{ matrix.platform }}.zip" > "x-ui-windows-${{ matrix.platform }}.zip.sha256"

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-windows-${{ matrix.platform }}
          path: |
            ./x-ui-windows-${{ matrix.platform }}.zip
            ./x-ui-windows-${{ matrix.platform }}.zip.sha256

      - name: Upload files to GH release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-windows-${{ matrix.platform }}.zip*
          file_glob: true
          overwrite: true
          prerelease: true

  # =================================
  #  Rolling dev channel (per-commit)
  # =================================
  publish-dev:
    name: Publish rolling dev release
    needs: [build, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          if ! command -v gh >/dev/null 2>&1; then
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) GH_ARCH="amd64" ;;
              aarch64|arm64) GH_ARCH="arm64" ;;
            esac
            curl -fsSL "https://github.com/cli/cli/releases/download/v2.60.1/gh_2.60.1_linux_${GH_ARCH}.tar.gz" | tar -xz -C /tmp
            export PATH="/tmp/gh_2.60.1_linux_${GH_ARCH}/bin:$PATH"
          fi

          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Rolling development build — installs via the panel's Dev update channel.

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated per-commit build from main. Not a stable release."

          # Force-move the dev-latest tag to this commit so the release tracks it.
          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          retry gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.zip dev-artifacts/*.sha256 --clobber
